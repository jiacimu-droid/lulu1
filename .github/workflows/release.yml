name: Lulu APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
  workflow_dispatch:
    inputs:
      release_number:
        description: '正式发布编号，例如 1、2、3'
        required: true
        default: '1'
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: lulu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p apk-artifacts
          apk="$(find app/build/outputs/apk/debug -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" apk-artifacts/Lulu.apk

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-APK-${{ github.sha }}
          path: apk-artifacts/Lulu.apk
          if-no-files-found: error
          retention-days: 7

      - name: Validate release number
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          [[ "$RELEASE_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo '发布编号必须是从 1 开始的正整数。'
            exit 1
          }

      - name: Publish Lulu release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          set -euo pipefail
          tag="lulu-v${RELEASE_NUMBER}"
          gh release create "$tag" apk-artifacts/Lulu.apk \
            --title "Lulu v${RELEASE_NUMBER}" \
            --notes "Lulu v${RELEASE_NUMBER}，构建自 ${GITHUB_SHA}。"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: APK-failure-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const marker = `<!-- lulu1-ci-failure:${context.sha} -->`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (existing.some(issue => issue.body?.includes(marker))) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] APK build failed on ${shortSha}`,
              body: [
                marker,
                '## Lulu APK 自动构建失败',
                '',
                `- **运行：** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- **提交：** ${shortSha}`,
                '',
                '请优先查看本次运行中的 `gradle-build.log`。'
              ].join('\n')
            })
