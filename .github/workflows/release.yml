name: Lulu APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lulu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build optimized APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python scripts/test_timeline_migration.py
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assemblePhone 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p apk-artifacts
          phone_apk="$(find app/build/outputs/apk/phone -name '*.apk' -print -quit)"
          test -n "$phone_apk"
          cp "$phone_apk" apk-artifacts/Lulu-arm64.apk
          python scripts/apk_size_report.py "$phone_apk" | tee ci-logs/apk-size.log

      - name: Upload temporary APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-APK-${{ github.sha }}
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Lulu release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="lulu-v${RELEASE_NUMBER}"
          title="Lulu v${RELEASE_NUMBER}"
          notes="${title}，仅提供 ARM64 手机包（功能完整），构建自 ${GITHUB_SHA}。"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apk-artifacts/*.apk --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" apk-artifacts/*.apk \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

      # A passing main build supersedes build-only tickets from older commits.
      # Do not touch feature/bug issues authored by humans.
      - name: Close superseded APK failure issues
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const markerPattern = /<!-- lulu1-ci-failure:[0-9a-f]{40} -->/
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const oldBuildFailures = issues.filter(issue =>
              !issue.pull_request &&
              issue.title.startsWith('[CI] APK build failed on ') &&
              markerPattern.test(issue.body || '')
            )
            for (const issue of oldBuildFailures) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '当前 main 的 APK 测试、构建及发布已成功完成，',
                  '该历史提交的失败不再阻断最新版本；因此关闭这条构建告警。',
                  '',
                  '成功运行：' + [
                    'https://github.com',
                    context.repo.owner,
                    context.repo.repo,
                    'actions/runs',
                    context.runId
                  ].join('/')
                ].join('\n')
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              })
            }

      - name: Upload failure logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: APK-failure-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const marker = `<!-- lulu1-ci-failure:${context.sha} -->`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (existing.some(issue => issue.body?.includes(marker))) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] APK build failed on ${shortSha}`,
              body: [
                marker,
                '## Lulu APK 自动构建失败',
                '',
                `- **运行：** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- **提交：** ${shortSha}`,
                '',
                '请优先查看本次运行中的 `gradle-build.log`。'
              ].join('\n')
            })
