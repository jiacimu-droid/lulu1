name: Lulu APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lulu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: One-time map import fix
        if: ${{ hashFiles('app/src/main/java/com/jiacimu/lulu/games/ApocalypseWorldMapV5.kt') != '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/jiacimu/lulu/games/ApocalypseWorldMapV5.kt')
          t = p.read_text()
          marker = 'import androidx.compose.foundation.Canvas\n'
          wanted = 'import androidx.compose.foundation.BorderStroke\nimport androidx.compose.foundation.Canvas\n'
          if 'import androidx.compose.foundation.BorderStroke\n' not in t:
              if marker not in t:
                  raise SystemExit('import marker missing')
              t = t.replace(marker, wanted, 1)
              p.write_text(t)
              print('patched')
          else:
              print('already patched')
          PY
          if git diff --quiet; then
            echo 'no changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/jiacimu/lulu/games/ApocalypseWorldMapV5.kt
            git commit -m 'fix: import BorderStroke for apocalypse map [skip ci]'
            git push origin HEAD:main
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p apk-artifacts
          apk="$(find app/build/outputs/apk/debug -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" apk-artifacts/Lulu.apk

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-APK-${{ github.sha }}
          path: apk-artifacts/Lulu.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Lulu release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="lulu-v${RELEASE_NUMBER}"
          title="Lulu v${RELEASE_NUMBER}"
          notes="${title}，构建自 ${GITHUB_SHA}。"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apk-artifacts/Lulu.apk --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" apk-artifacts/Lulu.apk \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: APK-failure-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const marker = `<!-- lulu1-ci-failure:${context.sha} -->`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (existing.some(issue => issue.body?.includes(marker))) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] APK build failed on ${shortSha}`,
              body: [marker, '## Lulu APK 自动构建失败', '', `- **运行：** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, `- **提交：** ${shortSha}`, '', '请优先查看本次运行中的 `gradle-build.log`。'].join('\n')
            })
