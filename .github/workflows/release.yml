name: Lulu APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lulu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: One-time hidden cinematic director upgrade
        if: ${{ !contains(hashFiles('app/src/main/java/com/jiacimu/lulu/games/ApocalypseSurvivalV5Engine.kt'), 'never-match') }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('app/src/main/java/com/jiacimu/lulu/games/ApocalypseSurvivalV5Engine.kt')
          app_path = Path('app/src/main/java/com/jiacimu/lulu/games/ApocalypseSurvivalV5App.kt')
          engine = engine_path.read_text()
          app = app_path.read_text()

          if 'apocalypseCinematicDirectorBibleV5(save)' not in engine:
              marker = '        appendLine(apocalypseWorldGeographyPromptV5())\n'
              if marker not in engine:
                  raise SystemExit('engine geography marker missing')
              engine = engine.replace(marker, marker + '        appendLine(apocalypseCinematicDirectorBibleV5(save))\n', 1)

          if '16. 故事必须有“电影呼吸”' not in engine:
              marker = '        15. foodDelta/waterDelta必须包含真实消耗与搜集的净变化；长时间行动不能人人永远不喝水不吃东西。基地等级越高，休息恢复、净水、医疗和长期生产才越可靠。\n'
              extra = '''        16. 故事必须有“电影呼吸”：连续高压2—3幕后安排低压段落，让人物做饭、疗伤、守夜、修车、谈心、争执或整理遗物；安静段也必须推进关系或信息。\n        17. 每4—7幕至少让一个旧细节获得新意义；每8—14幕才允许一次真正改变局面的阶段性大场面或重大回收。不要每幕反转，也不要连续十几幕没有任何兑现。\n        18. 同时维护生存层、人际/势力层、长期谜团层。单幕突出1—2层即可，第三层只留可回看的微小痕迹，避免百科全书式解释。\n        19. 设计经典末世电影式场面时只借用“类型结构”而非具体作品：撤离、围困、夜间搜救、车队、桥隧、停电、暴雨、港口、山路、临时安全区等都必须由当前地理与资源状态自然触发。\n        20. 重要NPC必须拥有独立于玩家的目标、恐惧、关系和底线；至少维持若干NPC彼此之间的关系线。秘密不等于背叛，死亡不等于深刻。禁止靠随机杀熟和强行黑化制造刺激。\n        21. 安全区、组织和联盟可以可靠一段时间。若它们后来出问题，原因应来自资源、制度、隐瞒、误判、研究伦理或立场冲突，并提前留下证据，而不是“其实全员坏人”。\n        22. 保留希望和生活感：热饭、修好的灯、重新接通的电台、生日、第一茬蔬菜、陌生人的善意都可以成为重要剧情。黑暗只有和可失去的美好并存才有重量。\n        23. 长期蓝图、隐藏线、人物秘密和伏笔回收计划都是导演私密信息，绝不能在正文中直接列出、解释或提前剧透；玩家只能通过当下可观察的事件逐步发现。\n'''
              if marker not in engine:
                  raise SystemExit('director rules marker missing')
              engine = engine.replace(marker, marker + extra, 1)

          if '让场景像电影而不是剧情摘要' not in engine:
              marker = '        - 结尾停在自然可行动节点，不替玩家决定下一步。\n'
              extra = '''        - 让场景像电影而不是剧情摘要：用可感知的环境变化、动作、停顿、声音、光线和人物反应承载信息；避免角色站着互相讲设定。\n        - 对话要有潜台词和人物差异。重要人物可以避而不答、说半句、误解、改口或在行动中表达立场，但不能为了悬念故意全员谜语人。\n        - 大场面前先建立空间和目标，大场面后必须留下实际后果；安静场景同样要有情绪、关系或选择上的推进。\n        - 不要为了“刺激”频繁杀角色、背叛、抓走队友或突然出现更强怪物。真正的悬念来自已有规则下越来越难的选择。\n'''
              if marker not in engine:
                  raise SystemExit('writer ending marker missing')
              engine = engine.replace(marker, extra + marker, 1)

          old = '''            item { ApocalypseV5SectionTitle("导演长期蓝图", "方向可以被玩家行动改写") }\n            items(defaultApocalypseLongTermPlan()) { item ->\n                Surface(color = ApocalypseV5Colors.white, shape = RoundedCornerShape(15.dp), border = BorderStroke(1.dp, ApocalypseV5Colors.border)) {\n                    Text(item, color = ApocalypseV5Colors.ink, fontSize = 11.sp, lineHeight = 18.sp, modifier = Modifier.padding(12.dp))\n                }\n            }\n'''
          new = '''            item { ApocalypseV5SectionTitle("时代走向", "只告诉你这个世界会面对什么，不提前公开导演的未来事件和伏笔") }\n            items(apocalypsePublicEraGuideV5(), key = { it.first }) { (title, detail) ->\n                Surface(color = ApocalypseV5Colors.white, shape = RoundedCornerShape(15.dp), border = BorderStroke(1.dp, ApocalypseV5Colors.border)) {\n                    Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {\n                        Text(title, color = ApocalypseV5Colors.blueStrong, fontWeight = FontWeight.Bold)\n                        Text(detail, color = ApocalypseV5Colors.muted, fontSize = 11.sp, lineHeight = 18.sp)\n                    }\n                }\n            }\n'''
          if old in app:
              app = app.replace(old, new, 1)
          elif 'ApocalypseV5SectionTitle("时代走向"' not in app:
              raise SystemExit('world blueprint marker missing')

          engine_path.write_text(engine)
          app_path.write_text(app)
          PY

          if git diff --quiet; then
            echo 'No cinematic director patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/jiacimu/lulu/games/ApocalypseSurvivalV5Engine.kt app/src/main/java/com/jiacimu/lulu/games/ApocalypseSurvivalV5App.kt
          git commit -m 'feat: deepen apocalypse cinematic story direction [skip ci]'
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p apk-artifacts
          apk="$(find app/build/outputs/apk/debug -name '*-debug.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" apk-artifacts/Lulu.apk

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-APK-${{ github.sha }}
          path: apk-artifacts/Lulu.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Lulu release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="lulu-v${RELEASE_NUMBER}"
          title="Lulu v${RELEASE_NUMBER}"
          notes="${title}，构建自 ${GITHUB_SHA}。"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" apk-artifacts/Lulu.apk --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" apk-artifacts/Lulu.apk \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: APK-failure-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const marker = `<!-- lulu1-ci-failure:${context.sha} -->`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (existing.some(issue => issue.body?.includes(marker))) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] APK build failed on ${shortSha}`,
              body: [
                marker,
                '## Lulu APK 自动构建失败',
                '',
                `- **运行：** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- **提交：** ${shortSha}`,
                '',
                '请优先查看本次运行中的 `gradle-build.log`。'
              ].join('\n')
            })
