name: Lulu APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Keep one automatic build running to avoid endless restart on busy main.
  # Manual APK requests have a separate slot and cannot wait behind a stuck push build.
  # Only the latest pending request of each kind is retained.
  group: lulu-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung Gradle/test step must not occupy the runner/queue for hours.
    # Normal full-phone builds are much shorter; failures still retain logs.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The renderer is bundled locally inside the APK; no CDN, chat API or
      # remote scripts are used by the actual Live2D WebView.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build bundled Live2D stage
        run: |
          node tools/live2d/test/parameters.mjs
          node tools/live2d/test/touch-hit.mjs
          npm install --prefix tools/live2d --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run build --prefix tools/live2d
          test -s app/src/main/assets/live2d/renderer.js

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # The action itself installs modern cmdline-tools. The default
          # "tools platform-tools" includes the removed legacy "tools" package.
          packages: 'platform-tools'

      - name: Install Whisper native build tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # Downloading the large NDK archive occasionally yields a truncated
          # ZIP ("Error on ZipFile unknown archive") on GitHub runners.
          # Retry only this transient SDK installation, not APK builds or tests.
          for attempt in 1 2 3; do
            echo "SDK install attempt ${attempt}/3"
            if sdkmanager --install "cmake;3.22.1" "ndk;27.0.12077973" &&
               test -f "${sdk_root}/cmake/3.22.1/source.properties" &&
               test -f "${sdk_root}/ndk/27.0.12077973/source.properties"; then
              echo "CMake and NDK verified"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::CMake/NDK installation failed after three verified attempts"
              exit 1
            fi
            # SDK manager may retain a partial NDK download, causing every
            # following attempt to replay the same broken archive.
            rm -rf "${sdk_root}/.temp" "${sdk_root}/ndk/27.0.12077973"
            sleep "$((attempt * 5))"
          done

      # Robolectric's MavenArtifactFetcher does not use Gradle's repositories.
      # Select a responsive repository for its original SDK 30 artifact instead
      # of forcing a 404 prefetch (or removing/skipping tests).
      - name: Select Robolectric test SDK mirror
        run: |
          set -euo pipefail
          version='11-robolectric-6757853-i7'
          path="org/robolectric/android-all-instrumented/${version}/android-all-instrumented-${version}"
          for repository in \
            'https://maven-central.storage-download.googleapis.com/maven2' \
            'https://repo.maven.apache.org/maven2' \
            'https://repo1.maven.org/maven2'; do
            echo "Checking Robolectric test repository: ${repository}"
            if curl --fail --silent --show-error --location --head \
                --connect-timeout 8 --max-time 25 --retry 2 --retry-delay 2 \
                "${repository}/${path}.pom" >/dev/null 2>&1 &&
               curl --fail --silent --show-error --location --head \
                --connect-timeout 8 --max-time 25 --retry 2 --retry-delay 2 \
                "${repository}/${path}.jar" >/dev/null 2>&1; then
              echo "ROBOLECTRIC_REPOSITORY_URL=${repository}" >> "$GITHUB_ENV"
              echo "Selected Robolectric repository: ${repository}"
              exit 0
            fi
          done
          # A mirror check is advisory. Cached SDK jars may already be usable,
          # so let the full test task run and report its actual result.
          echo "::warning::No test SDK mirror verified; trying configured default at test runtime"

      - name: Test and build phone APK
        # Run the full JVM/Robolectric suite against the same phone variant we ship.
        # Testing debug then assembling phone compiled the large Kotlin app twice.
        # No tests are removed; both tasks share the phone compilation graph.
        # Normal builds finish well before this; treat a silent hour-long stall as a failure.
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p ci-logs
          # Test the watchdog separately; it only diagnoses silent Gradle runs
          # and must never change the tests or prematurely kill the worker.
          bash scripts/test_ci_gradle_stall_watch.sh
          node scripts/test_xhs_reader.js
          python scripts/test_timeline_migration.py
          : > ci-logs/gradle-build.log
          bash scripts/ci_gradle_stall_watch.sh \
            ci-logs/gradle-build.log ci-logs/gradle-stall-diagnostics.log &
          stall_watch_pid=$!
          trap 'kill "$stall_watch_pid" 2>/dev/null || true; wait "$stall_watch_pid" 2>/dev/null || true' EXIT
          # Preserve full unit suite and its original build timeout. If Robolectric
          # stops emitting progress, collect an actionable JVM thread snapshot.
          gradle --no-daemon --max-workers=1 -Dkotlin.compiler.execution.strategy=in-process --stacktrace :app:verifyArtSafeVariants :app:testPhoneUnitTest :app:assemblePhone 2>&1 | tee ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p apk-artifacts
          phone_apk="$(find app/build/outputs/apk/phone -name '*.apk' -print -quit)"
          test -n "$phone_apk"
          # Prevent recurrence of Android 16 ART VerifyError caused by R8
          # rewriting the oversized unified-reply coroutine. Verify final
          # phone APK content, not just Gradle source configuration.
          python scripts/verify_phone_apk_bytecode.py "$phone_apk" | tee ci-logs/apk-bytecode-check.log
          cp "$phone_apk" apk-artifacts/Lulu-arm64.apk
          python scripts/apk_size_report.py "$phone_apk" | tee ci-logs/apk-size.log

      - name: Upload temporary APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-APK-${{ github.sha }}
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish Lulu release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="lulu-v${RELEASE_NUMBER}"
          title="Lulu v${RELEASE_NUMBER}"
          notes="${title}，仅提供 ARM64 手机包（功能完整），构建自 ${GITHUB_SHA}。修复 Android 16 VerifyError：此版未启用 R8 优化、使用原签名支持保留数据覆盖安装；实际运行仍需真机验证。"

          # GitHub Releases can return a temporary HTTP 5xx after a valid APK
          # has already been built. Retry only publication, never the Gradle
          # test/build; re-check the tag each time in case creation succeeded
          # on the server before the request failed.
          publish_release() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" apk-artifacts/*.apk --clobber || return
              gh release edit "$tag" --title "$title" --notes "$notes" || return
            else
              gh release create "$tag" apk-artifacts/*.apk \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "$notes" || return
            fi
          }

          for attempt in 1 2 3; do
            if publish_release; then
              echo "Lulu release published on attempt ${attempt}/3"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::GitHub Release publication failed after three attempts"
              exit 1
            fi
            echo "::warning::GitHub Release publication attempt ${attempt}/3 failed; retrying"
            sleep "$((attempt * 5))"
          done

      # A passing main build supersedes build-only tickets from older commits.
      # Do not touch feature/bug issues authored by humans.
      - name: Close superseded APK failure issues
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const markerPattern = /<!-- lulu1-ci-failure:[0-9a-f]{40} -->/
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const oldBuildFailures = issues.filter(issue =>
              !issue.pull_request &&
              issue.title.startsWith('[CI] APK build failed on ') &&
              markerPattern.test(issue.body || '')
            )
            for (const issue of oldBuildFailures) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '当前 main 的 APK 测试、构建及发布已成功完成，',
                  '该历史提交的失败不再阻断最新版本；因此关闭这条构建告警。',
                  '',
                  '成功运行：' + [
                    'https://github.com',
                    context.repo.owner,
                    context.repo.repo,
                    'actions/runs',
                    context.runId
                  ].join('/')
                ].join('\n')
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              })
            }

      - name: Upload failure logs
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: APK-failure-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.slice(0, 7)
            const marker = `<!-- lulu1-ci-failure:${context.sha} -->`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            if (existing.some(issue => issue.body?.includes(marker))) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] APK build failed on ${shortSha}`,
              body: [
                marker,
                '## Lulu APK 自动构建失败',
                '',
                `- **运行：** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- **提交：** ${shortSha}`,
                '',
                '请优先查看本次运行中的 `gradle-build.log`。'
              ].join('\n')
            })
