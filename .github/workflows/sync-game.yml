name: Sync main into game

on:
  push:
    branches: [main]
  schedule:
    # Also catch main updates whose commit messages skip CI.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lulu-main-into-game
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the latest main into game
        id: merge
        shell: bash
        run: |
          echo 'build=false' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin main:refs/remotes/origin/main game:refs/remotes/origin/game
            git switch --detach origin/game
            original=$(git rev-parse HEAD)
            upstream=$(git rev-parse origin/main)

            if git merge-base --is-ancestor "$upstream" "$original"; then
              echo 'The game branch already contains the latest main.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Reuse ordinary main changes; keep game-owned gameplay where
            # both branches changed the same lines. Never copy the stable
            # edition switch (false) into the experimental game release.
            if ! git merge --no-commit --no-ff -X ours "$upstream"; then
              {
                echo '### Unexpected merge conflicts on the game branch'
                git diff --name-only --diff-filter=U | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              exit 1
            fi

            edition='app/src/main/java/com/jiacimu/lulu/games/LuluGameStore.kt'
            python3 - "$edition" <<'PY'
import pathlib, sys
path = pathlib.Path(sys.argv[1])
source = path.read_text()
if 'const val worldGamesEnabled = false' not in source and \
        'const val worldGamesEnabled = true' not in source:
    raise SystemExit('The edition switch was lost during the merge')
path.write_text(source.replace('const val worldGamesEnabled = false',
                               'const val worldGamesEnabled = true'))
PY
            # Tests about the two experimental worlds must run in game,
            # not inherit main's deliberate absence expectations.
            git restore --source="$original" -- \
              app/src/test/java/com/jiacimu/lulu/games/GameInvitationContinuityTest.kt \
              app/src/test/java/com/jiacimu/lulu/games/CharacterSoloWorldPlayTest.kt \
              app/src/test/java/com/jiacimu/lulu/data/AutonomousAffordanceContextTest.kt \
              app/src/test/java/com/jiacimu/lulu/data/CharacterSelfActivityRuntimeTest.kt
            git add -A
            git -c core.editor=true commit -m "Merge main into game (preserve experimental worlds)"

            if git push origin HEAD:refs/heads/game; then
              printf 'Merged main `%s` into game `%s`.\n' "$upstream" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              if ! git diff --quiet "$original" HEAD -- app ci scripts services tools \
                build.gradle.kts settings.gradle.kts gradle.properties .github/workflows/release.yml \
                preview/arcade preview/world-joystick.js; then
                echo 'build=true' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            echo "::warning::Push attempt $attempt failed. Fetching the current branch before retrying."
          done
          exit 1

      - name: Build the updated game APK
        if: steps.merge.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger another workflow's push event.
          for attempt in 1 2 3; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref game; then
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          exit 1
