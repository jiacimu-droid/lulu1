name: Refresh code index

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/generate_code_index.py'
      - 'preview/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-index-main
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate repository index
        env:
          INDEX_COMMIT: ${{ github.sha }}
          INDEX_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/generate_code_index.py

      - name: Validate generated index
        run: |
          test -s docs/architecture/CODE_INDEX.md
          test -s docs/architecture/code-index.json
          python3 -m json.tool docs/architecture/code-index.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('docs/architecture/code-index.json').read_text(encoding='utf-8'))
          required={'schemaVersion','generatedAt','commit','branch','sourceFingerprint','summary','symbolIndex','files'}
          missing=sorted(required-data.keys())
          if missing: raise SystemExit(f"missing keys: {', '.join(missing)}")
          if not data['files']: raise SystemExit('code index contains no files')
          if len(data['sourceFingerprint']) != 64: raise SystemExit('invalid fingerprint')
          PY

      - name: Commit refreshed index
        run: |
          if [ -z "$(git status --porcelain -- docs/architecture/CODE_INDEX.md docs/architecture/code-index.json)" ]; then
            echo 'Code index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force docs/architecture/CODE_INDEX.md docs/architecture/code-index.json
          git commit -m 'docs: refresh code index [skip ci] [skip index]'
          git pull --rebase origin main
          git push origin HEAD:main
